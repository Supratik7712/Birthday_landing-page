<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Happy Birthday! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .birthday-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-20px)
            }
        }

        /* Photo square */
        .photo-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            animation: photoEntrance 1.5s ease-out;
        }

        @keyframes photoEntrance {
            from {
                opacity: 0;
                transform: scale(.5) rotate(-10deg)
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0)
            }
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            padding: 6px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 300%;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.45);
            animation: gradientMove 4s ease infinite;
        }

        @keyframes gradientMove {

            0%,
            100% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }
        }

        .photo-inner {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: white;
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform .4s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.1);
        }

        /* Titles */
        .number-20 {
            font-size: 100px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        h1 {
            font-size: 40px;
            color: #333;
            margin-bottom: 8px;
        }

        .name {
            color: #764ba2;
            font-size: 56px;
            font-weight: 700;
            margin: 18px 0;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.08);
            animation: colorChange 4s infinite;
        }

        @keyframes colorChange {

            0%,
            100% {
                color: #764ba2
            }

            50% {
                color: #667eea
            }
        }

        .message {
            font-size: 20px;
            color: #555;
            line-height: 1.7;
            margin: 22px 0;
        }

        .cake-icon {
            font-size: 80px;
            animation: bounce 1s infinite;
            cursor: pointer;
            display: inline-block;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-15px)
            }
        }

        .wish-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 42px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.35);
        }

        /* Floating decorations base (shared) */
        .floating {
            position: fixed;
            pointer-events: none;
            user-select: none;
            z-index: 999;
            will-change: transform, opacity;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
        }

        .floating-star {
            color: #ffd54a;
            filter: drop-shadow(0 4px 8px rgba(255, 213, 74, 0.25));
        }

        .floating-heart {
            color: #ff6b81;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 129, 0.18));
        }

        .floating-cake {
            color: #fff;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.18));
        }

        /* rise animation used by stars/hearts/cakes */
        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.9) rotate(0deg);
                opacity: 1;
            }

            25% {
                transform: translateY(-20vh) scale(1.02) rotate(45deg);
                opacity: 1;
            }

            70% {
                transform: translateY(-70vh) scale(1.05) rotate(200deg);
                opacity: 0.9;
            }

            100% {
                transform: translateY(-110vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* confetti/balloons/sparkles existing classes (kept simple) */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s linear infinite;
            z-index: 800;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .balloons {
            position: fixed;
            bottom: -100px;
            font-size: 60px;
            animation: float-up 6s ease-in infinite;
            z-index: 700;
        }

        @keyframes float-up {
            0% {
                bottom: -100px;
                opacity: 1
            }

            100% {
                bottom: 100vh;
                opacity: 0
            }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 1.5s infinite;
            box-shadow: 0 0 10px white;
            z-index: 700;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0)
            }

            50% {
                opacity: 1;
                transform: scale(1)
            }
        }

        /* Responsiveness */
        @media (max-width:768px) {
            .photo-container {
                width: 180px;
                height: 180px;
            }

            .number-20 {
                font-size: 70px;
            }

            .name {
                font-size: 42px;
            }

            .cake-icon {
                font-size: 64px;
            }

            .message {
                font-size: 18px;
            }
        }

        @media (max-width:480px) {
            .photo-container {
                width: 150px;
                height: 150px;
            }

            .number-20 {
                font-size: 60px;
            }

            .name {
                font-size: 32px;
            }

            .cake-icon {
                font-size: 56px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="birthday-card" role="main" aria-label="Birthday card">
        <div class="number-20"></div>

        <div class="photo-container">
            <div class="photo-frame">
                <div class="photo-inner">


<img src="roopkatha.jpeg" alt="Roopkatha">




                </div>
            </div>
        </div>

        <h1>Happy Birthday</h1>
        <div class="name">Roopkatha!</div>

        <div class="cake-icon" onclick="celebrate()" title="Celebrate">🎂</div>

        <div class="message">
            Wishing you the most amazing birthday! May your day be filled with laughter, love, and joy. Here's to
            many more memories and dreams coming true! 🎉✨Loads of love and best wishes from Supratik!
        </div>

        <button class="wish-button" onclick="celebrate()">Make a Wish! 🌟</button>
    </div>

    <script>
        /* Utilities */
        const randBetween = (min, max) => Math.random() * (max - min) + min;
        const isMobile = () => window.innerWidth <= 480;

        /* Existing celebratory pieces (confetti, balloons, sparkles) */
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#ff9ff3', '#54a0ff'];
            for (let i = 0; i < 36; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = `${randBetween(0, 100)}vw`;
                    el.style.top = `-10px`;
                    el.style.width = `${randBetween(6, 12)}px`;
                    el.style.height = `${randBetween(6, 12)}px`;
                    el.style.background = colors[Math.floor(randBetween(0, colors.length))];
                    const dur = randBetween(2.2, 4.2);
                    el.style.animationDuration = `${dur}s`;
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), (dur + 0.5) * 1000);
                }, i * 25);
            }
        }

        function createBalloons() {
            const icons = ['🎈', '🎉', '🎊', '✨', '🎁', '🌟'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'balloons';
                    el.textContent = icons[Math.floor(randBetween(0, icons.length))];
                    el.style.left = `${randBetween(0, 90)}vw`;
                    el.style.fontSize = `${randBetween(isMobile() ? 24 : 40, isMobile() ? 48 : 72)}px`;
                    el.style.animationDuration = `${randBetween(5, 9)}s`;
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), (parseFloat(el.style.animationDuration) + 0.5) * 1000);
                }, i * 300);
            }
        }

        function createSparkles() {
            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'sparkle';
                el.style.left = `${randBetween(0, 100)}vw`;
                el.style.top = `${randBetween(0, 100)}vh`;
                el.style.animationDelay = `${randBetween(0, 1.5)}s`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }
        }

        /* NEW: floating stars, hearts and mini-cakes */
        function createFloating(type, count = 8) {
            const emojiMap = { star: '⭐', heart: '❤️', cake: '🎂' };
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = `floating floating-${type}`;
                    el.textContent = emojiMap[type] || '✨';

                    // Position & size
                    const left = randBetween(5, 92);
                    el.style.left = `${left}vw`;
                    // set baseline size and scale down on mobile
                    const size = (() => {
                        if (type === 'star') return randBetween(isMobile() ? 14 : 20, isMobile() ? 30 : 46);
                        if (type === 'heart') return randBetween(isMobile() ? 16 : 24, isMobile() ? 34 : 52);
                        return randBetween(isMobile() ? 18 : 24, isMobile() ? 36 : 56); // cake
                    })();
                    el.style.fontSize = `${Math.round(size)}px`;

                    // animation timing
                    const duration = randBetween(3.6, 6.5);
                    const delay = randBetween(0, 0.9);
                    el.style.animation = `rise ${duration}s cubic-bezier(.2,.9,.2,1) ${delay}s forwards`;

                    // subtle rotation origin for variety
                    el.style.transformOrigin = '50% 50%';

                    document.body.appendChild(el);

                    // remove after animation
                    setTimeout(() => el.remove(), (duration + delay + 0.3) * 1000);
                }, i * randBetween(80, 180));
            }
        }

        /* Celebrate triggers everything */
        function celebrate() {
            createConfetti();
            createBalloons();
            createSparkles();
            createFloating('star', 10);
            createFloating('heart', 9);
            createFloating('cake', 4);
        }

        /* Initial load: small burst + continuous gentle bursts */
        window.addEventListener('load', () => {
            // initial burst
            celebrate();

            // periodic smaller bursts so page doesn't get too heavy
            setInterval(() => {
                // occasional little bursts of hearts & stars
                createFloating('star', 6);
                createFloating('heart', 5);
                if (Math.random() > 0.6) createFloating('cake', 2);
            }, 7000);

            // gentle sparkles throughout
            setInterval(createSparkles, 4000);
        });

        // keep elements responsive if user resizes
        window.addEventListener('resize', () => {
            // nothing fancy needed — createFloating checks isMobile at each call
        });
    </script>
</body>

</html>
